        <!-- js -->
        <script src="/cuckooWeb/js/jquery-3.7.1.min.js"></script>

    <body>

        <header id="header" class="header">
            <div class="inner">
                <div class="gnb">

                    <div class="logo-area">
                        <a class="cuckoo-logo" href="/">
                            <svg class="icon-logo">
                                <use xlink:href="/cuckooWeb/images/sprite.svg#cuckoo-logo"/>
                            </svg>
                        </a>
                    </div>
    
                    <div class="gnb-area">
                        <ul class="gnb-list">
                            <li class="gnb-link" data-target="about"><a>회사소개</a></li>
                            <li class="gnb-link" data-target="investor"><a>투자정보</a></li>
                            <li class="gnb-link" data-target="esg"><a>지속가능경영</a></li>
                            <li class="gnb-link" data-target="ethic"><a>윤리경영</a></li>
                        </ul>
                    </div>
    
                    <div class="sub-gnb-area">
                        <ul class="sub-gnb-list">
                            <li>
                                <a href="https://www.cuckoo.co.kr/" target="_blank">
                                    <span>쿠쿠몰</span>
                                    <svg class="icon-18px">
                                        <use xlink:href="/cuckooWeb/images/sprite.svg#over"/>
                                    </svg>
                                </a>
                            </li>
                            <li>
                                <a href="https://www.cuckoo.co.kr/company/channel?searchCd=1" target="_blank">
                                    <span>미디어</span>
                                    <svg class="icon-18px">
                                        <use xlink:href="/cuckooWeb/images/sprite.svg#over"/>
                                    </svg>
                                </a>
                            </li>
                            <li>
                                <a href="https://recruit.cuckoo.co.kr/recruit/Main.do" target="_blank">
                                    <span>채용</span>
                                    <svg class="icon-18px">
                                        <use xlink:href="/cuckooWeb/images/sprite.svg#over"/>
                                    </svg>
                                </a>
                            </li>
                        </ul>
                        <div class="gnb-line"></div>

                        <!-- 번역기능이있어야 사용가능 -->
                        <!-- <div class="lang-choice">
                            <a class="lang-select-btn">
                                <svg class="icon-18px">
                                    <use xlink:href="/cuckooWeb/images/sprite.svg#oversea"/>
                                </svg>
                                <span class="region">KO</span>
                                <svg class="icon-18px dropdown">
                                    <use xlink:href="/cuckooWeb/images/sprite.svg#dropdown"/>
                                </svg>
                            </a>
                            <ul class="lang-select-list">
                                <li><a>KO</a></li>
                                <li><a>EN</a></li>
                            </ul>
                        </div> -->


                        <a class="sitemap-btn">
                            <svg class="icon-32px">
                                <use xlink:href="/cuckooWeb/images/sprite.svg#burger-menu"/>
                            </svg>
                        </a>
                    </div>
    
                </div>
            </div> 
            <!-- lnb -->
            <%- include('/layout/lnb.html') %>
            <!-- lnb -->
        </header>

        
        <!-- sitemap -->
        <%- include('/layout/sitemap.html') %>

        <!-- 윤리경영제보 팝업 -->
